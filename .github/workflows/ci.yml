name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  unit:
    # 兩版 Node：engines 是 >=22，本機常是更新的版本；node:test 在非 TTY 的預設輸出 22 是 TAP、24 是 spec，依 Node 版本而異的行為兩版都要跑到
    # 另跑 Windows 的 Node 24（本機 Windows 的版本）：行程、路徑分隔符、cmd.exe 的差異只在 Windows 出現（#79）
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: ['22', '24']
        include:
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests (node:test, Node built-ins only)
        # 非 UTC 的時區：runner 是 UTC，誤用執行環境時區（getHours() 等）的程式碼在那裡結果剛好相同而測不出來
        env:
          TZ: America/New_York
        run: npm test

  real-sdk:
    # 真 SDK 冒煙測試（#162）：各平臺用鎖定檔（== 加 --hash）裝 SDK，以真的回覆型別跑 adapter 的每條 API 路徑
    # （tests/python/real_sdk_smoke.py；替換 SDK 的 create／sample，不呼叫模型、不需金鑰）。
    # adapter 測試用假模組，測不出 SDK 升級後回覆物件的形狀變了；dependabot 升級鎖定檔的 PR 也會跑到這裡。
    # Python 版本與 model-acceptance.yml 相同（鎖定檔以 3.12 產生）。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [chatgpt, deepseek, gemini, glm, grok]
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install platform SDK from the hashed lock file
        run: python3 -m pip install --require-hashes -r ".github/model-acceptance/$PLATFORM-requirements.txt"
      - name: Real-SDK smoke test (no network calls, no API keys)
        run: python3 tests/python/real_sdk_smoke.py "$PLATFORM"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Build data files and downloads
        run: npm run build
      - name: Static verification (data, sources, schema, demo engine checks + snapshot, secrets scan)
        run: npm run verify:static
      - name: Generated files are up to date (whole working tree, including new files)
        # 整份工作樹：建置寫到哪裡都會被檢查到，新增嵌入目標時不必改這裡；verify:static 不寫檔，所以不必排除任何檔案
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::建置產物與來源不一致：請勿手動編輯產物（複本、嵌入區塊、規則說明行、部署指南的 scripts/ 那一行、data/、downloads/），改來源後執行 npm run build 並提交（上方列出不一致的檔案）"
            exit 1
          fi
      - name: Python skills compile and dry-run (no API keys)
        run: |
          python3 -m py_compile skills/shared/*.py skills/*/api-workflow.py skills/*/preemptive-exposure-analysis/scripts/*.py
          for p in chatgpt grok glm deepseek gemini; do python3 skills/$p/api-workflow.py --dry-run >/dev/null; done
          for p in claude gemini; do python3 skills/$p/preemptive-exposure-analysis/scripts/validate_inputs.py examples/synthetic-org >/dev/null; done
      - name: Python tests (analysis workflow core, model adapters with fake SDKs, scope gate shared cases; stdlib unittest)
        run: python3 -m unittest discover -s tests/python -v
      - name: Platform skill-package ZIPs run standalone after unzip (dry-run, no API keys)
        run: |
          for p in chatgpt grok glm deepseek gemini claude; do
            d=$(mktemp -d)
            {
              python3 -m zipfile -e "downloads/skills-$p.zip" "$d" &&
              if [ "$p" != claude ]; then (cd "$d" && python3 "skills/$p/api-workflow.py" --dry-run >/dev/null); fi &&
              # 會被單獨安裝的技能資料夾（Claude、Gemini）：技能內的 validate_inputs.py 也要能跑
              if [ "$p" = claude ] || [ "$p" = gemini ]; then
                (cd "$d" && python3 "skills/$p/preemptive-exposure-analysis/scripts/validate_inputs.py" examples/synthetic-org >/dev/null)
              fi
            } || { echo "::error::downloads/skills-$p.zip 無法解壓或解壓後無法執行，請檢查 scripts/skill-packages.mjs 的對照表"; exit 1; }
            rm -rf "$d"
          done
      - name: Demo engine and scripts refuse without scope (--no-scope, --exclude scope)
        # 只看「不是 0」的話，程式崩潰（結束碼 1）也會被當成拒絕（#170）：示範引擎要正好是 2；
        # API 腳本授權範圍中止的結束碼本來就是 1，跟崩潰分不出來，所以另外比對 stderr 有共用核心的中止訊息（MISSING_SCOPE_ABORT）
        run: |
          code=0; out=$(node scripts/run-demo.mjs --no-scope 2>&1) || code=$?
          [ "$code" -eq 2 ] || { echo "::error::示範引擎缺 scope 應以結束碼 2 拒絕，實際是 $code"; echo "$out"; exit 1; }
          echo '示範引擎：缺 scope 已拒絕（exit 2）'
          abort=$(python3 -c "import sys; sys.path.insert(0, 'skills/shared'); import analysis_workflow; print(analysis_workflow.MISSING_SCOPE_ABORT)")
          for p in chatgpt grok glm deepseek gemini; do
            code=0; err=$(python3 skills/$p/api-workflow.py --dry-run --exclude scope 2>&1 >/dev/null) || code=$?
            if [ "$code" -ne 1 ] || ! printf '%s\n' "$err" | grep -qF -- "$abort"; then
              echo "::error::$p 缺 scope 應以結束碼 1 中止並印出授權範圍守門的訊息；實際結束碼 $code，stderr："; echo "$err"; exit 1
            fi
            echo "$p：缺 scope 已中止（exit 1）"
          done
      - name: Backend worker builds with embedded prompt (syntax only, no deploy)
        run: node scripts/build-worker.mjs && node --check backend/dist/worker.js

  browser:
    runs-on: ubuntu-latest
    needs: [unit, verify]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install Playwright (from package-lock.json) and Chromium
        timeout-minutes: 20
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build data files and downloads
        run: npm run build
      - name: Browser verification (navigation, search, filters, copy, download, case interaction, mobile, a11y)
        id: verification
        run: npm run verify
      - name: List screenshots that differ from the committed ones (warning only)
        # 截圖偶爾有零星的反鋸齒雜訊，不讓 job 失敗，只列出：一行 warning，job summary 放每張的 md5 與像素差異（#265）
        # 比對執行目錄與 HEAD 已提交的版本，不看工作樹；判定是不是雜訊見 docs/agents/workflow.md 的截圖交叉比對
        if: ${{ steps.verification.outcome == 'success' }}
        continue-on-error: true
        env:
          RUN_DIRECTORY: ${{ steps.verification.outputs.run-directory }}
        run: node scripts/screenshot-diff.mjs "$RUN_DIRECTORY"
      - name: Committed verify-report.md is up to date (ignoring the run time line)
        # 報告嵌入網站附錄，過時了沒有別的檢查會發現；執行時間每次都不同，其餘內容要逐行相同。截圖不讓 job 失敗，只列出（上一步）
        # 判定用 scripts/verify-report.mjs 的 sameReportIgnoringRunTime（full-check.mjs 也用它，#139）；不同時另外印出完整的差異給人看
        run: |
          if ! node --input-type=module -e "import { sameReportIgnoringRunTime } from './scripts/verify-report.mjs'; import { readFileSync } from 'node:fs'; import { execFileSync } from 'node:child_process'; process.exit(sameReportIgnoringRunTime(execFileSync('git', ['show', 'HEAD:verify-report.md'], { encoding: 'utf8' }), readFileSync('verify-report.md', 'utf8')) ? 0 : 1)"; then
            diff <(git show HEAD:verify-report.md) verify-report.md || true
            echo "::error::已提交的 verify-report.md 過時了（上方是差異）。更新方式：本機執行 node scripts/verify.mjs，或下載這次 run 的 artifact：gh run download ${{ github.run_id }} -n verify-report-and-screenshots，用其中的 verify-report.md 覆蓋；再執行 npm run build（報告嵌入 data/extra.js），兩者一起提交"
            exit 1
          fi
      - name: Upload verification report and screenshots
        if: ${{ always() && steps.verification.outputs.run-directory != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-report-and-screenshots
          path: |
            ${{ steps.verification.outputs.run-directory }}/verify-report.md
            ${{ steps.verification.outputs.run-directory }}/verify-screenshots/
          retention-days: 14
