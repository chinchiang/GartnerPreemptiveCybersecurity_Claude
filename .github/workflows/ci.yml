name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Unit tests (node:test, Node built-ins only)
        # 非 UTC 的時區：runner 是 UTC，誤用執行環境時區（getHours() 等）的程式碼在那裡結果剛好相同而測不出來
        env:
          TZ: America/New_York
        run: npm test
      - name: Build data files and downloads
        run: npm run build
      - name: Static verification (data, sources, schema, demo engine checks + snapshot, secrets scan)
        run: npm run verify:static
      - name: Generated files are up to date (whole working tree, including new files)
        # 整份工作樹：建置寫到哪裡都會被檢查到，新增嵌入目標時不必改這裡；verify:static 不寫檔，所以不必排除任何檔案
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::建置產物與來源不一致：複本、嵌入區塊與規則說明行請勿手動編輯，改 skills/shared/ 的母本；改完來源後執行 npm run build 並提交（上方列出不一致的檔案）"
            exit 1
          fi
      - name: Python skills compile and dry-run (no API keys)
        run: |
          python3 -m py_compile skills/shared/*.py skills/*/api-workflow.py skills/claude/preemptive-exposure-analysis/scripts/validate_inputs.py
          for p in chatgpt grok glm deepseek; do python3 skills/$p/api-workflow.py --dry-run >/dev/null; done
          python3 skills/claude/preemptive-exposure-analysis/scripts/validate_inputs.py examples/synthetic-org
      - name: Python tests (analysis workflow core, model adapters with fake SDKs, scope gate shared cases; stdlib unittest)
        run: python3 -m unittest discover -s tests/python -v
      - name: Platform skill-package ZIPs run standalone after unzip (dry-run, no API keys)
        run: |
          for p in chatgpt grok glm deepseek claude; do
            d=$(mktemp -d)
            {
              python3 -m zipfile -e "downloads/skills-$p.zip" "$d" &&
              if [ "$p" = claude ]; then
                (cd "$d" && python3 skills/claude/preemptive-exposure-analysis/scripts/validate_inputs.py examples/synthetic-org >/dev/null)
              else
                (cd "$d" && python3 "skills/$p/api-workflow.py" --dry-run >/dev/null)
              fi
            } || { echo "::error::downloads/skills-$p.zip 無法解壓或解壓後無法執行，請檢查 scripts/skill-packages.mjs 的對照表"; exit 1; }
            rm -rf "$d"
          done
      - name: Demo engine and scripts refuse without scope (--no-scope, --exclude scope)
        run: |
          node scripts/run-demo.mjs --no-scope && { echo '缺 scope 應拒絕'; exit 1; } || echo '缺 scope 已拒絕（exit 2）'
          for p in chatgpt grok glm deepseek; do python3 skills/$p/api-workflow.py --dry-run --exclude scope >/dev/null 2>&1 && { echo "$p 缺 scope 未中止"; exit 1; } || true; done
      - name: Backend worker builds with embedded prompt (syntax only, no deploy)
        run: node scripts/build-worker.mjs && node --check backend/dist/worker.js

  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install Playwright (from package-lock.json) and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build data files and downloads
        run: npm run build
      - name: Browser verification (navigation, search, filters, copy, download, case interaction, mobile, a11y)
        run: npm run verify
      - name: Upload verification report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-report-and-screenshots
          path: |
            verify-report.md
            verify-screenshots/
          retention-days: 14
